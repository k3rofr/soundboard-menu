<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MENU</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #ff4081;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
        }

        .main-video-container {
            flex: 2;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 500px;
            display: block;
        }

        .playlist {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            border-left: 5px solid transparent;
            transition: background 0.2s;
        }

        .playlist-item:hover {
            background: #333;
        }

        .playlist-item.active {
            background: #383838;
            border-left-color: #ff4081;
        }

        .thumbnail-placeholder {
            width: 70px;
            height: 45px;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border-radius: 4px;
            color: #ccc;
            font-weight: bold;
        }

        .video-info h3 {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .video-info p {
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Pop Classics Playlist</h1>

    <div class="container">
        <!-- Native HTML5 Video Player -->
        <div class="main-video-container">
            <video id="video-player" controls autoplay src="https://archive.org"></video>
        </div>

        <!-- Sidebar Playlist -->
        <div class="playlist">
            <div class="playlist-item active" onclick="changeVideo('https://archive.org', this)">
                <div class="thumbnail-placeholder">TGIF</div>
                <div class="video-info">
                    <h3>Last Friday Night (T.G.I.F.)</h3>
                    <p>Katy Perry</p>
                </div>
            </div>

            <div class="playlist-item" onclick="changeVideo('https://archive.org', this)">
                <div class="thumbnail-placeholder">1000M</div>
                <div class="video-info">
                    <h3>A Thousand Miles</h3>
                    <p>Vanessa Carlton</p>
                </div>
            </div>

            <div class="playlist-item" onclick="changeVideo('https://archive.org', this)">
                <div class="thumbnail-placeholder">CMB</div>
                <div class="video-info">
                    <h3>Call Me Maybe</h3>
                    <p>Carly Rae Jepsen</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeVideo(videoUrl, element) {
            const player = document.getElementById('video-player');
            
            // Change source and load new video
            player.src = videoUrl;
            player.load();
            player.play();

            // Handle active menu switching
            const items = document.querySelectorAll('.playlist-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
