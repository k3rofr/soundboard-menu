<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC SOUNDBOARD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #ff4081;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .main-video {
            flex: 2;
            position: relative;
            padding-bottom: 45%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .main-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .playlist {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 450px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            border-left: 5px solid transparent;
        }

        .playlist-item:hover {
            background: #383838;
            transform: translateX(5px);
        }

        .playlist-item.active {
            background: #383838;
            border-left-color: #ff4081;
        }

        .thumbnail-placeholder {
            width: 80px;
            height: 45px;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 4px;
            color: #aaa;
            font-weight: bold;
        }

        .video-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .video-info p {
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .main-video {
                padding-bottom: 56.25%;
            }
        }
    </style>
</head>
<body>

    <h1>Pop Classics Playlist</h1>

    <div class="container">
        <!-- Main Video Player -->
        <div class="main-video">
            <iframe id="video-player" src="https://youtube.com" allowfullscreen></iframe>
        </div>

        <!-- Sidebar Playlist -->
        <div class="playlist">
            <div class="playlist-item active" onclick="changeVideo('https://youtube.com', this)">
                <div class="thumbnail-placeholder">TGIF</div>
                <div class="video-info">
                    <h3>Last Friday Night (T.G.I.F.)</h3>
                    <p>Katy Perry</p>
                </div>
            </div>

            <div class="playlist-item" onclick="changeVideo('https://youtube.com', this)">
                <div class="thumbnail-placeholder">1000M</div>
                <div class="video-info">
                    <h3>A Thousand Miles</h3>
                    <p>Vanessa Carlton</p>
                </div>
            </div>

            <div class="playlist-item" onclick="changeVideo('https://youtube.com', this)">
                <div class="thumbnail-placeholder">CMB</div>
                <div class="video-info">
                    <h3>Call Me Maybe</h3>
                    <p>Carly Rae Jepsen</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeVideo(videoUrl, element) {
            // Update the iframe source
            document.getElementById('video-player').src = videoUrl;

            // Remove active class from all items
            const items = document.querySelectorAll('.playlist-item');
            items.forEach(item => item.classList.remove('active'));

            // Add active class to the clicked item
            element.classList.add('active');
        }
    </script>

</body>
</html>
